[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-bible-toolchain"
version = "1.0.0"
description = "《现代 C++ 终极圣经》生产级工具链：门禁、构建、发布、本地开发一体化 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "阿信", email = "liaoranran@example.com"}
]
keywords = ["cpp", "documentation", "toolchain", "ci", "mkdocs", "pandoc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # 核心仅依赖标准库；以下为建设站点/发布所需
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
]

[project.optional-dependencies]
# PDF/EPUB 发布（CI 与本地 WSL）
pdf = [
    "pypandoc>=1.13.0",
]
# 本地开发与 lint
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# CI 额外（PageFind 通过 pip 安装二进制扩展）
ci = [
    "pagefind[extended]>=1.1.0",
]
# 一键全装
all = [
    "cpp-bible-toolchain[pdf,dev,ci]",
]

[project.scripts]
cppbible = "tools.cppbible:main"

[project.urls]
Homepage = "https://liaoranran.github.io/CPP-Bible"
Repository = "https://github.com/LiaoRanran/CPP-Bible"

[tool.setuptools]
# 不打包 Book/ 等大量文件，仅暴露 CLI
py-modules = ["tools.cppbible"]

[tool.cppbible]
# ⚠️ 工具链**不由本段决定**：唯一事实源是仓库根 toolchain.toml
# （由 tools/toolchain.py 解析：prefer 列表 → PATH 回退 → 内置兜底，缺配置永不崩）。
# 此处原先硬编码的本机绝对路径（C:/Users/...、C:/Qt/...）无任何代码读取（死配置），
# 只会误导读者以为换机器要改这里，已移除；换机器请改 toolchain.toml 或设环境变量。
clang = "clang++"
parallel_workers = 8
compile_std = "c++23"
# 核心门禁清单（按执行顺序）
quality_gates = [
    "tools/preflight_check.py",
    "tools/consistency_check.py",
    "tools/crossref_audit.py",
    "tools/xref_check.py",
    "tools/gen_indexes.py --check",
    "tools/density_audit.py --check 20",
    "tools/d5_appendix_audit.py",
    "tools/d5_source_integrity.py --check",
    "tools/terminology_normalize.py --check",
    "tools/exercise_dup_guard.py",
    "tools/verify_asm_evidence.py --root Book --examples Examples",
    "tools/book_asm_freshness.py",
    "tools/structure_audit.py --check",
    "tools/sweep_fences.py --check",
    "tools/whitespace_fix.py --check",
    "tools/s10_verify_mark.py --check",
    "tools/writer_selfcheck.py --all",
    "tools/fix_book_links.py --check",
    # 原子内核（G1-G3）新增门禁；与 tools/cppbible.py:cmd_check 的 quality 元组一一对应
    # （一致性由 tools/gate_engine.py --manifest-check 校验，ADR-0004 收敛双清单）
    "tools/atom_coverage_map.py --check --check-doc",
    # 373 §5（2026-09-13）收编：Book ↔ 原子双向同步（与 cppbible.py quality 元组对齐）
    "tools/book_atom_sync.py --check",
    "tools/atom_evidence_replay.py --check",
    "tools/gate_engine.py --check",
    "tools/golden_lock.py check",
    "tools/debt_ledger.py check",
    "tools/poison_drill.py",
    # 494 任务 6：对抗回归看板（本地沙箱探针实跑；CI 无 _adv_*/ 时自动空转 exit 0）
    "tools/adversarial_regression.py",
    # 498 任务 3：核心工具完整性校验（基准 tools/.tool_checksums 入库）
    "tools/tool_integrity.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]   # 与 tests/conftest.py 的 sys.path 注入等效（pytest>=7）
# 508 任务1：pytest-xdist 并行。实测 366 点全绿，wall 227s → 153.8s（−32%）；
# 剩余耗时下限是 test_json_output.py::test_golden_lock_json（单进程内跑全库 replay
# 复算，~125s，无法再切分）。`-n auto` 按核数自适应（本机 32 核 → 32 worker）。
# `--dist loadgroup` 让 `xdist_group("serial")` 真正生效（见 tests/conftest.py 的
# serial 机制）；无组的测试退化为默认 load 调度，无额外代价。
addopts = "-q -n auto --dist loadgroup"
