claim:
  id: EV-CONC-001
  statement: '`while (!b) {}`（b 为非原子非 volatile 全局 `int`）在 `-O2` 下是否被整段消除， 由**同步操作落在循环体内还是体外**决定，而不是由"函数里有没有屏障"决定：
    无屏障（`spin_plain`）与屏障在**循环体外**（`spin_fence_outside`）都被整段消除， 函数符号区间内**零** `s_*_b`
    符号引用；屏障在**循环体内**（`spin_signal_fence` 零机器指令 / `spin_with_fence` 产 `lock`）则循环保留，区间内可见
    `s_sf_b` / `s_f_b` 与循环回边。'
  domain: conc
  type: observation
