claim:
  id: ATOM-LANG-INLINE-001
  statement: '`inline` 函数（及变量）的定义可以出现在**多个翻译单元**，但各定义必须由**相同的 token 序列**构成 （[basic.def.odr]/16.4）；违反属
    ill-formed, **no diagnostic required**——实测 GCC 家族**零诊断**， 且**当两个定义的可观测结果不同时**，其可观测行为由**链接顺序**与**优化档**共同决定：-O0（未内联）下链接器只保留同名符号的一个定义
    （取先遇到的），行为随链接顺序改变；-O2（内联发生）下各 TU 内联「自己看到的定义」，行为与链接顺序 无关、两个值并列出现。'
  domain: lang
  type: observation
