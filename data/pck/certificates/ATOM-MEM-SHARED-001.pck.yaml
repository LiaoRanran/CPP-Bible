  id: ATOM-MEM-SHARED-001
  statement: std::shared_ptr<T> 用引用计数实现共享所有权：拷贝 +1、析构 -1，计数归零才释放资源（析构恰好一次）。 控制块（RAII）管理计数与资源。但它不能自动处理循环引用——两个对象互相
    shared_ptr 持有，彼此计数 为 2，离开作用域后各减到 1 仍互指，计数永不归零 => 泄漏；循环必须用 weak_ptr 打破。
