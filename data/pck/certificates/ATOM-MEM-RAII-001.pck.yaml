claim:
  id: ATOM-MEM-RAII-001
  statement: RAII 的核心是"资源生命周期绑定到对象生命周期"：构造时获取资源、析构时释放。栈展开时（即使函数 因异常提前返回）作用域内对象的析构按构造逆序自动调用，因此
    RAII 管理的资源在异常路径也不泄漏； 裸 new/delete 在异常路径跳过 delete 则泄漏。lock_guard、unique_ptr、vector
    都是 RAII。
