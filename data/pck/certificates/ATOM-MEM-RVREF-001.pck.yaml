schema_version: 619-pck-v1
claim:
  id: ATOM-MEM-RVREF-001
  statement: 函数形参声明为 `T&&` 时，形参名在函数体内是**左值**：`T y = x;` 触发拷贝构造； 只有 `T y = std::move(x);`
    把 x 变成 xvalue，才会选中移动构造；而对**无移动构造**的类型， 即使写了 `std::move(x)` 也**静默退化**成拷贝。（C++11–C++23
    全档实测，十一档一致； **例外**：`return x;` 路径随版本变化——C++17 及更早是拷贝，C++20 起已隐式移动，见 EV-MEM-005。）
  domain: mem
  type: observation
