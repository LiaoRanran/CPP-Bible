  id: EV-MEM-042
  statement: 三种生命周期行为可用**零依赖信号**（volatile 析构计数）区分，且该区分**不依赖任何 sanitizer**： `scoped`（局部对象）析构
    =1；`cycle`（shared_ptr 强引用闭环）析构 =0 且**不可达**（真泄漏）； `owned`（堆对象被全局容器持有）析构 =0 但**退出时仍可达**（与
    cycle 语义完全不同）。 一个"析构 =0"的信号对应**两种不同语义**，因此它必须与"可达性"一起看才能下判断。
  domain: mem
  type: observation
