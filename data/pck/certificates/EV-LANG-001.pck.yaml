schema_version: 619-pck-v1
claim:
  id: EV-LANG-001
  statement: inline 函数在两个 TU 中被定义为**不同 token 序列**（违反 [basic.def.odr]/16.4）时，GCC 家族
    **不产生任何诊断**（16.2 属 IFNDR）；且其可观测后果**依赖优化档**：-O0 下未内联，链接器只保留 同名 weak 符号的一个定义（取先遇到者）→
    程序行为随**链接顺序**改变；-O2 下两 TU 的调用点各自 内联「自己看到的定义」→ 行为与链接顺序无关。**内部链接（static）孪生对照**证明：顺序依赖来自
    "外部链接 + 未内联时的符号合并"这一机制，而非"两 TU 代码不同"本身。
  domain: lang
  type: observation
