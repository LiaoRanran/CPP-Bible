schema_version: 619-pck-v1
claim:
  id: EV-MEM-032
  statement: unique_ptr 的删除器是**类型的一部分**（`unique_ptr<T, D>` 的 D 进类型系统）：在 libstdc++
    实现下， 空**且非 final** 的删除器被空基类优化吸收（sizeof == 裸指针 8 字节），有状态删除器必须作为对象 成员存储（sizeof 16）；数组特化
    `unique_ptr<T[]>` 走 delete[] 而不是 delete，且只提供 operator[]、 不提供 operator* / operator->——这些差异全部在**编译期**就能被类型系统看见。
  domain: mem
  type: observation
