schema_version: 619-pck-v1
claim:
  id: EV-MEM-033
  statement: shared_ptr 的删除器被**类型擦除**：语言层面不存在 `shared_ptr<T, D>`（对比 `unique_ptr<T,
    D>` 有 D 参数），删除器只能经构造函数按值注入并被控制块持有（一次拷贝发生在形参初始化，块内不再拷贝）； 对象大小恒为两个指针（16 字节）、与删除器类型无关。擦除的运行期代价是**控制块自身的堆分配**：
    实测 `shared_ptr<T>(new T)` 触发 2 次堆分配（对象 + 控制块）、`make_shared<T>` 合并为 1 次， 而 unique_ptr
    对照路径恒为 1 次（只有对象本身）。
  domain: mem
  type: observation
