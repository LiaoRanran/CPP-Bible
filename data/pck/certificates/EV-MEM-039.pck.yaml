claim:
  id: EV-MEM-039
  statement: 小对象分配策略的开销**必须实测，且"谁更快"本身就是平台/实现相关的**：同一夹具、同一工作量 （10000 次 64 字节分配+释放
    × 7 轮取中位数）在 MinGW/libstdc++ 上单调缓冲与池都胜过全局 new （约 4.4× 与 2.0×），而在 Linux/glibc 上**三者全部翻转**——全局
    new 最快，两种资源反而慢 （约 1.9× 与 1.37×）。故"池分配器更快"不是可移植结论；可移植的是因果链（回收与否） 与"必须实测"这条方法论。
  domain: mem
  type: observation
