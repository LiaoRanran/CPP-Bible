  id: EV-MEM-041
  statement: '**pool 与 bitmap 的 bookkeeping 都随块数线性增长**，差异只在**单位粒度**： pool 每块一个指针（8
    B/块）、bitmap 每块一位（1/8 B/块）⇒ **系数约 64×** ——这直接决定了两者在同一规模下的绝对开销（n=8000：pool 64000
    B vs bitmap 1000 B）。 而 arena 的元数据**不随规模变**（恒 32 B），因为**它放弃单块释放、不维护任何 bookkeeping**。
    教学点因此不是"谁线性谁不线性"，而是"**bookkeeping 的单位粒度决定增长系数**"。'
