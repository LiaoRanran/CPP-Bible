name: Docker Reproduce

# 693-C3 · 复现镜像构建与自检
#
# 触发策略：
#   * push/PR 只改 docker/reproduce/** scripts/** docs/ENVIRONMENT.md requirements.txt 时才跑
#     （避免每次提交都花 runner 分钟去构建一个没人用的镜像）；
#   * 打 tag 时必跑（发布前确认镜像能构建）；
#   * 支持手工触发。
#
# ⚠ 诚实登记
# ----------
# 本 workflow 由 693 批次新增，**从未在 GitHub Actions 上实际执行过**
# （693 执行环境未安装 Docker，也无法触发远程 CI）。
# 首次运行若失败，请**把日志原样贴进 issue**，不要靠改 Dockerfile 里的版本号"让它过"。

on:
  push:
    branches: [main, master]
    tags: ['v*']        # 打 tag 时无条件跑（发布前确认镜像可构建）
    paths:
      - 'docker/reproduce/**'
      - 'scripts/**'
      - 'docs/ENVIRONMENT.md'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docker/reproduce/**'
      - 'scripts/**'
      - 'docs/ENVIRONMENT.md'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # apt 装 gcc-12/clang-14/cppcheck/valgrind + 两阶段构建
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 只构建、不推送：本 job 的目的是"证明它能构建"，不是发布镜像。
    # 推送留到 release.yml（打 tag 时）。
    - name: Build reproduce image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/reproduce/Dockerfile
        push: false
        tags: queyi-reproduce:693
        load: true            # load 到本机 docker 以便下一步 run
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 镜像内的 RUN 已经做过版本自检（gcc 12.3.0 / clang 14.0 / cppcheck 2.7 /
    # valgrind 3.18 / python 3.10）；这里再跑一遍脚本档体检，把输出留在日志里。
    - name: Environment check inside image
      run: |
        docker run --rm queyi-reproduce:693 \
          bash -lc 'scripts/verify_environment.sh --profile=docker-ubuntu-22.04' || {
            echo "::warning::环境体检在容器内未全绿（详见上方输出）"
          }

    - name: Tool version evidence
      run: |
        docker run --rm queyi-reproduce:693 bash -lc '
          gcc --version     | head -1
          g++ --version     | head -1
          clang --version   | head -1
          cppcheck --version
          valgrind --version
          python3 --version
        '

  # 全链复现跑一遍。放在 build 之后：镜像构建失败就不必浪费时间跑实验。
  reproduce:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build reproduce image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/reproduce/Dockerfile
        push: false
        tags: queyi-reproduce:693
        load: true
        cache-from: type=gha

    - name: Run scripts/reproduce_all.sh in container
      run: |
        docker run --rm -v "$PWD/out:/workspace/out" queyi-reproduce:693 \
          bash -lc 'scripts/reproduce_all.sh --out out/693_ci'

    - name: Upload reproduce report
      uses: actions/upload-artifact@v7
      with:
        name: queyi-reproduce-report
        path: out/693_ci/99_reproduce_report.md
        retention-days: 30
        if-no-files-found: warn
