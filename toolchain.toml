# toolchain.toml — 工具链路径的「唯一事实源」
#
# 背景：此前 6 个 tools/*.py 里散落 12 处硬编码 `C:/Qt/Tools/...`，
# 换机器 / 换 CI 镜像 / Qt 升级即全链崩，且失败信息不指向根因。
# 现在所有工具统一经 tools/toolchain.py 解析本文件。
#
# 用法：换环境时只改这里，不要改任何 tools/*.py。
# 解析规则：按 prefer 顺序探测，第一个存在即用；全部缺失才回退 PATH。

[compiler]
# 与书内汇编证据同源的 GCC 15.3.0（mingw1530）优先；1310 为遗留回退。
prefer = [
  "C:/Qt/Tools/mingw1530_64/bin/g++.exe",
  "C:/Qt/Tools/mingw1310_64/bin/g++.exe",
]
# 全部 prefer 缺失时，在 PATH 上按这些名字探测
fallback_names = ["g++", "clang++"]

[binutils]
cxxfilt_prefer = [
  "C:/Qt/Tools/mingw1530_64/bin/c++filt.exe",
  "C:/Qt/Tools/mingw1310_64/bin/c++filt.exe",
]
cxxfilt_names = ["c++filt", "x86_64-w64-mingw32-c++filt", "c++filt.exe"]

objdump_prefer = [
  "C:/Qt/Tools/mingw1530_64/bin/objdump.exe",
  "C:/Qt/Tools/mingw1310_64/bin/objdump.exe",
]
objdump_names = ["objdump", "x86_64-linux-gnu-objdump", "objdump.exe"]

[python]
# 托管 Python（与 cppbible.py find_managed_python 同源）。
# prefer 支持 glob（versions/3.13.*/python.exe）：托管目录名为 3.13.12 但
# 其内二进制实为 3.13.14，故用 glob 容忍 patch 级改名，配置不锁死具体 patch。
# 全部缺失时回退到当前解释器 sys.executable，不因缺配置而崩。
prefer = [
  "C:/Users/ASUS/.workbuddy/binaries/python/versions/3.13.*/python.exe",
]
# 门禁期望的主/次版本：resolve_python() 的 self-check 会校验解析结果，
# 版本漂移（如被 uv 拉到 3.14）即非零退出。
expected = "3.13"

[clang]
# MSYS2 MINGW64 安装的 LLVM 22.1.8（2026-09-13 配置，清华镜像源）。
# 用于双编译器对照（GCC vs Clang）与 clang-tidy 静态分析。
# 注意：MSYS2 clang++ target 是 x86_64-w64-windows-gnu（与 MinGW GCC 同 ABI），
# 不是 MSVC ABI；如需 clang-cl 需另装 LLVM 官方构建。
# 当前 toolchain.py 可能不解析本段；replay 接入双编译器时读取。
prefer = [
  "C:/msys64/mingw64/bin/clang++.exe",
]
clang_tidy = "C:/msys64/mingw64/bin/clang-tidy.exe"
clang_format = "C:/msys64/mingw64/bin/clang-format.exe"
version = "22.1.8"

[ccache]
# Windows 侧 ccache 4.14（手动下载，2026-09-13 安置）；WSL 侧为 4.9.1（apt）。
# replay 接入编译缓存时读取；Windows 侧加速 MinGW 编译，WSL 侧加速 g++ 编译。
windows = "C:/tools/ccache/ccache.exe"
wsl = "/usr/bin/ccache"
version_windows = "4.14"
version_wsl = "4.9.1"
